<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Historial - PriceCompare</title>
    <link rel="icon" href="imagenes/logo1.png">
    <link rel="stylesheet" href="styles.css">
    <style>
        .historial-wrap { max-width: 780px; margin: 0 auto; padding: 28px 20px; }
 
        .historial-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
        }
        .historial-header h2 { margin: 0; font-size: 22px; }
 
        .plan-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: #fff3ea; color: #cc4e00; font-size: 13px;
            font-weight: 500; padding: 5px 14px; border-radius: 20px;
            margin-bottom: 18px;
        }
 
        .historial-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 13px 16px; margin-bottom: 8px; background: white;
            border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.07);
            transition: box-shadow 0.2s;
        }
        .historial-item:hover { box-shadow: 0 3px 10px rgba(0,0,0,0.1); }
 
        .historial-link {
            font-weight: 600; color: #ff6b00; text-decoration: none; font-size: 15px;
        }
        .historial-link:hover { text-decoration: underline; }
        .historial-fecha { margin: 3px 0 0; font-size: 12px; color: #888; }
 
        .btn-eliminar-uno {
            background: none; border: 1px solid #e2e8f0; color: #94a3b8;
            width: 32px; height: 32px; border-radius: 8px; cursor: pointer;
            font-size: 15px; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: all 0.15s;
        }
        .btn-eliminar-uno:hover { background: #fee2e2; border-color: #fca5a5; color: #e74c3c; }
 
        .btn-limpiar {
            background: #fee2e2; color: #e74c3c; border: none; padding: 9px 18px;
            border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600;
        }
        .btn-limpiar:hover { background: #fecaca; }
 
        .empty-state {
            text-align: center; padding: 60px 20px; color: #94a3b8;
        }
        .empty-state div { font-size: 48px; margin-bottom: 12px; }
        .empty-state p { font-size: 15px; margin: 0; }
    </style>
</head>
<body>
<header>
    <div class="logo">
        <a href="index.html"><img src="imagenes/logo1.png" alt="logo"></a>
    </div>
    <form class="buscador" action="busquedaProducto.html" method="GET">
        <input type="search" name="q" placeholder="Buscar productos..." required>
        <button type="submit">Buscar</button>
    </form>
    <div class="auth-buttons"></div>
</header>
 
<main>
    <div class="historial-wrap">
        <div class="historial-header">
            <h2>🕐 Mi Historial de Búsquedas</h2>
            <button class="btn-limpiar" onclick="confirmarLimpiar()">🗑 Limpiar todo</button>
        </div>
 
        <div id="plan-info"></div>
        <div id="lista-historial"><p style="color:#888;">Cargando...</p></div>
    </div>
</main>
 
<footer><p>© 2026 PriceCompare</p></footer>
 
<script src="script.js"></script>
<script>
const usuario = JSON.parse(localStorage.getItem("usuario") || "null");
if (!usuario) window.location.href = "/login.html";
 
async function cargarHistorial() {
    const contenedor = document.getElementById("lista-historial");
    const planInfo = document.getElementById("plan-info");
 
    // Mostrar info del plan
    try {
        const resPlan = await fetch(`/api/plan/${usuario.id}`);
        const plan = await resPlan.json();
        const limite = plan.historial_limite;
        planInfo.innerHTML = `
            <div class="plan-badge">
                📋 Plan ${plan.rol} — 
                ${limite === null
                    ? "Historial ilimitado ✨"
                    : `Últimas ${limite} búsquedas guardadas`}
            </div>
        `;
    } catch(_) {}
 
    // Cargar historial
    try {
        const res = await fetch(`/api/historial/usuario/${usuario.id}`);
        const data = await res.json();
 
        if (data.length === 0) {
            contenedor.innerHTML = `
                <div class="empty-state">
                    <div>🔍</div>
                    <p>No tienes búsquedas recientes.</p>
                </div>`;
            return;
        }
 
        contenedor.innerHTML = "";
        data.forEach(item => {
            const fecha = new Date(item.fecha).toLocaleDateString("es-CO", {
                day: "2-digit", month: "short", year: "numeric",
                hour: "2-digit", minute: "2-digit"
            });
            const div = document.createElement("div");
            div.className = "historial-item";
            div.id = `historial-${item.id}`;
            div.innerHTML = `
                <div>
                    <a href="busquedaProducto.html?q=${encodeURIComponent(item.busqueda)}"
                        class="historial-link">🔍 ${item.busqueda}</a>
                    <p class="historial-fecha">${fecha}</p>
                </div>
                <button class="btn-eliminar-uno" title="Eliminar esta búsqueda"
                    onclick="eliminarEntrada(${item.id})">✕</button>
            `;
            contenedor.appendChild(div);
        });
    } catch(err) {
        contenedor.innerHTML = "<p style='color:#e74c3c;'>Error al cargar historial.</p>";
    }
}
 
async function eliminarEntrada(historialId) {
    try {
        const res = await fetch(`/api/historial/entrada/${historialId}?usuario_id=${usuario.id}`, {
            method: "DELETE"
        });
        if (res.ok) {
            const el = document.getElementById(`historial-${historialId}`);
            if (el) el.remove();
 
            // Si quedó vacío
            const contenedor = document.getElementById("lista-historial");
            if (contenedor.children.length === 0) {
                contenedor.innerHTML = `
                    <div class="empty-state">
                        <div>🔍</div>
                        <p>No tienes búsquedas recientes.</p>
                    </div>`;
            }
        }
    } catch(err) {
        mostrarToast("Error al eliminar", "error");
    }
}
 
function confirmarLimpiar() {
    const modal = document.createElement("div");
    modal.style.cssText = `
        position:fixed; inset:0; background:rgba(0,0,0,0.5);
        display:flex; align-items:center; justify-content:center; z-index:9999;
    `;
    modal.innerHTML = `
        <div style="background:white; border-radius:14px; padding:32px;
                    max-width:360px; width:90%; text-align:center;
                    box-shadow:0 10px 40px rgba(0,0,0,0.2);">
            <div style="font-size:48px; margin-bottom:12px;">🗑️</div>
            <h3 style="margin:0 0 8px; color:#1e293b;">¿Eliminar historial?</h3>
            <p style="color:#64748b; margin:0 0 24px; font-size:14px;">
                Se borrarán todas tus búsquedas. Esta acción no se puede deshacer.
            </p>
            <div style="display:flex; gap:10px; justify-content:center;">
                <button onclick="this.closest('.modal-confirmar').remove()"
                    style="padding:10px 22px; border-radius:8px; border:1px solid #e2e8f0;
                           background:white; cursor:pointer; font-size:14px; color:#64748b;">
                    Cancelar
                </button>
                <button id="btn-confirmar-limpiar"
                    style="padding:10px 22px; border-radius:8px; border:none;
                           background:#e74c3c; color:white; cursor:pointer;
                           font-size:14px; font-weight:600;">
                    Sí, eliminar
                </button>
            </div>
        </div>
    `;
    modal.classList.add("modal-confirmar");
    document.body.appendChild(modal);
 
    modal.querySelector("#btn-confirmar-limpiar").onclick = async () => {
        modal.remove();
        await fetch(`/api/historial/usuario/${usuario.id}`, { method: "DELETE" });
        mostrarToast("Historial eliminado", "info");
        document.getElementById("lista-historial").innerHTML = `
            <div class="empty-state">
                <div>🔍</div>
                <p>No tienes búsquedas recientes.</p>
            </div>`;
    };
 
    // Cerrar al hacer click fuera
    modal.addEventListener("click", e => { if (e.target === modal) modal.remove(); });
}
 
actualizarHeader();
cargarHistorial();
</script>
</body>
</html>
